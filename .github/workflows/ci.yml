name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      # What `composer create-project` gives a new application: the released framework from Packagist.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix, sockets, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
